# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: 
      - master
      - master_04
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build veloce senza test
      - name: Build con Maven (senza test)
        run: mvn clean package -DskipTests
       
      
      # Esecuzione di tutti i test Maven (unit + integration + quality)
      - name: Run Maven Verify
        run: mvn verify
